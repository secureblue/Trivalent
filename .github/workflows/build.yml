on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      test_build:
        required: false
        type: boolean
        default: false
      override_version:
        required: true
        type: string
        default: ""
    secrets:
      RPM_SIGNING_KEY:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
      DISCORD_WEBHOOK:
        required: false
      BSKY_APP_PASSWORD:
        required: false

name: Create RPM Release

permissions: {}

jobs:
  buildsrpm:
    name: Build SRPM
    if: github.actor == 'royaloughtness' && (github.triggering_actor == 'royaloughtness' || github.triggering_actor == 'runson-v3-secureblue[bot]') # zizmor: ignore[bot-conditions]
    runs-on: "runs-on=${{ github.run_id }}/runner=x86_64-runner-small"
    container:
      image: "fedora:44@sha256:f717d3f59ea0dc45d3c024c9477e786bab7d418d26636920d17b48016f1e69ca"
    steps:
      - name: Notify Discord webhook of build start
        continue-on-error: true
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.ref_name }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"Build **${WORKFLOW_NAME}** started on branch \`${BRANCH_NAME}\`\"}" \
            "${DISCORD_WEBHOOK}"

      - name: Enable egress auditing
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Build SRPM
        shell: bash
        id: srpm_build
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
          CACHE_OVERRIDE_VERSION: ${{ inputs.override_version }}
        run: |
          dnf copr enable secureblue/trivalent -y
          dnf update -y
          dnf install git wget rpmbuild yum-utils rpm-sign -y
          if [ -n "${CACHE_OVERRIDE_VERSION}" ]; then
              dnf install "trivalent-chromium-clean-source-${CACHE_OVERRIDE_VERSION}" -y
          else
              dnf install trivalent-chromium-clean-source -y
          fi

          SOURCE_CACHE_HASH=$(sha256sum /usr/src/chromium/chromium-*.xz)
          echo "SOURCE_CACHE_HASH: ${SOURCE_CACHE_HASH}"
          git clone --branch "${BRANCH}" https://github.com/secureblue/Trivalent.git
          git -C Trivalent checkout --detach "${BUILD_SHA}"
          bash ./Trivalent/copr_script.sh
          rpmbuild -bs -v --define "_sourcedir $PWD" --define "_rpmdir $PWD" --define "_builddir $PWD" --define "_specdir $PWD" --define "_srcrpmdir $PWD" trivalent.spec
          SRPM_HASH=$(sha256sum *.rpm)
          echo "SRPM_HASH: ${SRPM_HASH}"

      - name: Save SRPM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: srpm-artifact
          path: "*.rpm"
          compression-level: 0
          retention-days: 30

  buildrpm:
    name: Build RPM
    if: github.actor == 'royaloughtness' && (github.triggering_actor == 'royaloughtness' || github.triggering_actor == 'runson-v3-secureblue[bot]') # zizmor: ignore[bot-conditions]
    timeout-minutes: 180
    needs: buildsrpm
    runs-on: "runs-on=${{ github.run_id }}/runner=x86_64-runner"
    container:
      image: "fedora:44@sha256:f717d3f59ea0dc45d3c024c9477e786bab7d418d26636920d17b48016f1e69ca"
      options: --privileged
    steps:
      - name: Enable egress auditing
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Retrieve SRPM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: srpm-artifact

      - name: Build RPM
        shell: bash
        id: rpm_build
        env:
          ARCH: ${{inputs.arch}}
        run: |
          dnf update -y
          dnf install rpm-build mock -y
          SRPM_HASH=$(sha256sum *.rpm)
          echo "SRPM_HASH: ${SRPM_HASH}"
          mock --resultdir=. -r "fedora-44-x86_64" --rebuild trivalent-*.src.rpm --arch="${ARCH}"
      - name: Surface build log
        if: always()
        run: |
          cat build.log || echo "build.log not found"

      - name: Upload log artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: "*.log"
          retention-days: 30

      - name: Prepare for upload
        shell: bash
        run: |
          rm trivalent-*.src.rpm

      - name: Save RPM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-artifact
          path: "*.rpm"
          compression-level: 0
          retention-days: 7

  sanitycheck:
    name: Sanity Check
    if: github.actor == 'royaloughtness' && (github.triggering_actor == 'royaloughtness' || github.triggering_actor == 'runson-v3-secureblue[bot]') # zizmor: ignore[bot-conditions]
    runs-on: "ubuntu-26.04"
    needs: buildrpm
    permissions:
      contents: read
    steps:
      - name: Enable egress auditing
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Retrieve RPM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm-artifact

      - uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        with:
          additional_guestagents: true

      - name: Make sure Trivalent starts
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          sudo apt-get install -qqy qemu-system-arm qemu-efi-aarch64
          limactl start -y --name=default --arch="${ARCH}" --set='.video.display = "vnc"' template:fedora-44
          lima sudo dnf install -y *.rpm cage grim
          lima sudo systemctl stop getty@tty1
          lima sudo systemd-run --uid=runner --unit=kiosk -p PAMName=login -p TTYPath=/dev/tty1 -p StandardInput=tty \
            -E WLR_RENDERER=pixman -p StandardOutput=journal cage -- setpriv --ambient-caps=-all trivalent
          until lima pgrep -f --older 5 type=renderer; do
            sleep 5; 
          done
          lima env WAYLAND_DISPLAY=wayland-0 grim /tmp/trivalent.png
          limactl copy default:/tmp/trivalent.png trivalent.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivalent-screenshot
          path: trivalent.png
          archive: false
          compression-level: 0
          retention-days: 7

  pushrpm:
    name: Push RPM
    if: github.actor == 'royaloughtness' && (github.triggering_actor == 'royaloughtness' || github.triggering_actor == 'runson-v3-secureblue[bot]') # zizmor: ignore[bot-conditions]
    environment: ${{ inputs.test_build && 'TestBuild' || 'Build' }}
    runs-on: "runs-on=${{ github.run_id }}/runner=x86_64-runner-small"
    container:
      image: "fedora:44@sha256:f717d3f59ea0dc45d3c024c9477e786bab7d418d26636920d17b48016f1e69ca"
    needs: sanitycheck
    concurrency:
      group: trivalent-publish
      cancel-in-progress: false
    outputs:
      hashes: ${{ steps.sign.outputs.hashes }}
      tag: ${{ steps.sign.outputs.tag }}
      version: ${{ steps.sign.outputs.version }}
    steps:
      - name: Enable egress auditing
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Retrieve RPM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm-artifact

      - name: Setup
        shell: bash
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: |
          dnf install rpm-sign createrepo rclone -y
          dnf update --refresh -y
          echo "${RPM_SIGNING_KEY}" | gpg --import
          echo "
          %_signature gpg
          %_gpg_name 26B4463ED8F313BC7E3FBDF9D9223AF0F47B3E41
          " > ~/.rpmmacros

      - name: Sign
        shell: bash
        if: ${{ ! inputs.test_build }}
        id: sign
        run: |
          shopt -s nullglob
          pattern='^trivalent-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-[0-9]+\.(x86_64|aarch64)\.rpm$'
          for file in trivalent-*.rpm; do
            if [[ "${file}" =~ ${pattern} ]]; then
              trivalent_rpm_file="${file}"
              break
            fi
          done
          if [[ -z "$trivalent_rpm_file" ]]; then
            echo "Trivalent RPM not found"
            exit 1
          else
            echo "Trivalent RPM found: ${trivalent_rpm_file}"
          fi

          rpm_name_version_release_arch="${trivalent_rpm_file%.rpm}"
          rpm_name_version_release="${rpm_name_version_release_arch%.*}"
          rpm_version_release="${rpm_name_version_release#trivalent-}"
          rpm_arch="${rpm_name_version_release_arch##*.}"
          echo "tag=${rpm_version_release}-${rpm_arch}" >> "$GITHUB_OUTPUT"
          echo "version=${rpm_version_release%-*}" >> "$GITHUB_OUTPUT"

          rpm --addsign *.rpm
          rpm_hash=$(sha256sum *.rpm | base64 -w0)
          echo "hashes=${rpm_hash}" >> "$GITHUB_OUTPUT"
          mkdir -p secureblue/Packages
          mv *.rpm secureblue/Packages
          cd secureblue
          createrepo .
          mergerepo --all --omit-baseurl --noupdateinfo --repo "${PWD}" --repo https://repo.secureblue.dev -o ../merged
          rm -rf repodata
          mv ../merged/repodata repodata
          gpg --detach-sign --local-user 26B4463ED8F313BC7E3FBDF9D9223AF0F47B3E41 --armor repodata/repomd.xml

      - name: Upload RPM and logs to R2 to trivalent Bucket
        shell: bash
        if: ${{ ! inputs.test_build }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SOURCE_DIR: .
        run: |
          rclone copy ./secureblue/ R2:/

      - name: Notify Discord webhook of build end
        continue-on-error: true
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.ref_name }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"Build **${WORKFLOW_NAME}** completed on branch \`${BRANCH_NAME}\`\"}" \
            "${DISCORD_WEBHOOK}"

  createrelease:
    name: Create Release
    if: ${{ ! inputs.test_build && github.actor == 'royaloughtness' && (github.triggering_actor == 'royaloughtness' || github.triggering_actor == 'runson-v3-secureblue[bot]') }} # zizmor: ignore[bot-conditions]
    environment: Build
    runs-on: "ubuntu-26.04"
    needs: pushrpm
    permissions:
      contents: write # to write to releases
    steps:
      - name: Enable egress auditing
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.pushrpm.outputs.tag }}
          VERSION: ${{ needs.pushrpm.outputs.version }}
          ARCH: ${{ inputs.arch }}
          LATEST: ${{ inputs.arch == 'x86_64' }}
        run: |
          previous_release="$(gh release list | cut -f3 | grep --max-count=1 -- "-${ARCH}$")"
          upstream_feed="$(curl -fsSL --retry 3 -G https://chromereleases.googleblog.com/feeds/posts/default \
            --data-urlencode alt=json \
            --data-urlencode "q=\"${VERSION}\" label:\"Desktop Update\"")"
          upstream_link="$(jq -r '.feed.entry[-1].link[] | select(.rel == "alternate").href' <<< "${upstream_feed}")"
          printf -v release_notes '## Upstream Changes\n\n%s\n' "${upstream_link}"
          gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TAG}" --latest="${LATEST}" \
            --generate-notes --notes-start-tag "${previous_release}" --notes "${release_notes}"

      - name: Post to Bluesky
        if: ${{ inputs.arch == 'x86_64' }}
        continue-on-error: true
        shell: bash
        env:
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          VERSION: ${{ needs.pushrpm.outputs.version }}
          TAG: ${{ needs.pushrpm.outputs.tag }}
          BSKY_ACTION_VERSION: v1.2.11
        run: |
          curl -fLsS --retry 5 \
            -O "https://github.com/cbrgm/bluesky-github-action/releases/download/${BSKY_ACTION_VERSION}/bluesky-github-action_linux-amd64" \
            -O "https://github.com/cbrgm/bluesky-github-action/releases/download/${BSKY_ACTION_VERSION}/bluesky-github-action_linux-amd64.asc"
          gpg --keyserver keys.openpgp.org --recv-keys DE2CA41786945C5CC12F5F435F1F18563E476666
          gpg --verify bluesky-github-action_linux-amd64.asc bluesky-github-action_linux-amd64
          printf -v bluesky_message "Trivalent %s released:\n\nhttps://github.com/%s/releases/tag/%s" "${VERSION}" "${GITHUB_REPOSITORY}" "${TAG}"
          chmod +x bluesky-github-action_linux-amd64
          ./bluesky-github-action_linux-amd64 --handle secureblue.dev --password "${BSKY_APP_PASSWORD}" --lang en --text "${bluesky_message}"

  provenance:
    needs: [pushrpm, createrelease]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.pushrpm.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.pushrpm.outputs.tag }}
      provenance-name: multiple.intoto.jsonl

  notify-failure:
    name: Notify Discord webhook of failure
    if: failure()
    needs: [buildsrpm, buildrpm, pushrpm, createrelease, provenance]
    runs-on: ubuntu-26.04
    steps:
      - name: Notify Discord webhook of build failure
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.ref_name }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"Build **${WORKFLOW_NAME}** failed on branch \`${BRANCH_NAME}\`: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "${DISCORD_WEBHOOK}"
